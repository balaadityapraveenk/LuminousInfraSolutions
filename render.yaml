services:
  # 1. Node.js Express Backend Service
  - type: web
    name: luminous-backend
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: luminous-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # 2. Main Frontend Static Site
  - type: web
    name: luminous-frontend
    runtime: static
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Render will prompt you to enter the public backend URL here (e.g. https://luminous-backend.onrender.com)

  # 3. Admin Dashboard Frontend Static Site
  - type: web
    name: luminous-admin-dashboard
    runtime: static
    buildCommand: cd admin-dashboard && npm install && npm run build
    publishPath: admin-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Render will prompt you to enter the public backend URL here (e.g. https://luminous-backend.onrender.com)

databases:
  # PostgreSQL Database Instance
  - name: luminous-db
    databaseName: luminouspower
    user: luminous_user
    plan: free
